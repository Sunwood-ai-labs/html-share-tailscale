<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#161C26">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>HTML Share — Tailscale</title>
  <link rel="stylesheet" href="/landing.css">
</head>
<body>
  <main class="landing-shell">
    <header class="landing-head">
      <a class="landing-brand" href="/" aria-label="HTML Share — Tailscale トップ">
        <img class="landing-icon" src="/icons/icon-192.png" alt="" width="44" height="44">
        <span><strong>HTML Share</strong><small>TAILSCALE EDITION</small></span>
      </a>
      <span class="tailnet-pill"><i aria-hidden="true"></i>TAILNET ONLY</span>
    </header>

    <div class="landing-grid">
      <section class="landing-copy" aria-labelledby="landing-title">
        <p class="eyebrow"><span class="eyebrow-mark" aria-hidden="true"></span>LOCAL WORKSPACE / 01</p>
        <h1 id="landing-title">HTMLを、<span>次の画面へ。</span></h1>
        <p class="lead">PCで作った生成結果を、このTailnetにつながる端末で確認。依頼を置き、AIからの確認にその場で返せます。</p>
        <div class="landing-actions">
          <a class="button" href="/app/index.html">共有ページを開く <span aria-hidden="true">↗</span></a>
          <a class="secondary-link" href="/review/index.html">インボックスを見る</a>
        </div>
        <p class="privacy"><span class="privacy-mark" aria-hidden="true">⌁</span> Tailnet内限定のセルフホスト型。データはこのPCから外へ出ません。</p>
      </section>

      <section class="landing-art" aria-label="HTML Share — TailscaleのTailnet接続イメージ">
        <div class="art-topline"><span>LOCAL / 2026</span><span>READY</span></div>
        <div class="art-grid" aria-hidden="true"></div>
        <div class="mark-ring" aria-hidden="true"><span></span></div>
        <img class="landing-art-icon" src="/icons/icon-192.png" alt="">
        <div class="art-note art-note-top"><span>01</span><b>生成結果</b><small>HTML / PNG / LINK</small></div>
        <div class="art-note art-note-bottom"><span>02</span><b>次の画面</b><small>TAILNET SYNC</small></div>
        <div class="art-footer"><span class="art-pulse"></span>private by default</div>
      </section>
    </div>
  </main>
</body>
</html>
