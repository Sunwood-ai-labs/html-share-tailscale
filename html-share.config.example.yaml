# ループバックだけで待ち受け、Tailscale Serveがこのプロセスへ中継します。
server:
  host: 127.0.0.1
  port: 4311
  publicUrl: https://your-device.example.ts.net:9222
  dataDir: .html-share/data
  siteDir: .html-share/site
  tailscale:
    hostname: your-device.example.ts.net
    httpsPort: 9222

content:
  roots:
    - examples
  pages:
    - path: examples/demo-report.html
      title: デモレポート
      slug: demo-report
      repository: examples
      stream: demo
      streamLabel: デモ
  maximumShareDays: 30
  maximumAssetBytes: 10485760
